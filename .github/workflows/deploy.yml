name: Deploy release to GitHub Pages

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify release identity
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {validateReleaseTag} from './tools/release/contracts.mjs'; validateReleaseTag(process.env.RELEASE_TAG, JSON.parse(readFileSync('package.json','utf8')).version)"
          git merge-base --is-ancestor HEAD origin/main
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false)' | grep -q 'false'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
      - name: Install dependencies
        run: npm ci
      - name: Build approved release
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: OpenBot
          user_email: 335604065+openbotgit[bot]@users.noreply.github.com
          commit_message: |
            Deploy release ${{ inputs.release_tag }} [skip ci]

            Co-authored-by: OpenBot <335604065+openbotgit[bot]@users.noreply.github.com>
